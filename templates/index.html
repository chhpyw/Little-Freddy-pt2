<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ollama Chat - Gemma 3 RAG</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="app-body">
    <div class="app-container">
        <nav class="app-nav">
            <button id="nav-chat" class="nav-btn active">Chat</button>
            <button id="nav-docs" class="nav-btn">Document Collection</button>
        </nav>

        <main class="content-area">
            <!-- Chat Tab -->
            <div id="tab-chat" class="tab-content active">
                <header>
                    <h1>Ollama Chat (RAG)</h1>
                    <p>Model: qwen3:1.7b | Embeddings: nomic-embed-text</p>
                </header>
                <div id="chat-window" class="chat-window"></div>
                
                <div class="controls-area">
                    <div class="toggle-container">
                        <span class="toggle-label">Web Search</span>
                        <label class="switch">
                            <input type="checkbox" id="web-search-toggle">
                            <span class="slider round"></span>
                        </label>
                    </div>
                </div>

                <div class="input-area">
                    <input type="text" id="user-input" placeholder="Ask a question..." autocomplete="off">
                    <button id="send-btn">Send</button>
                </div>
            </div>

            <!-- Documents Tab -->
            <div id="tab-docs" class="tab-content">
                <header>
                    <h1>Document Collection</h1>
                    <p>Upload your knowledge base</p>
                </header>
                <div class="docs-container">
                    <div class="upload-section">
                        <input type="file" id="file-upload" accept=".pdf,.txt,.docx,.md" style="display: none;">
                        <button id="upload-btn" class="secondary-btn">Select & Upload File</button>
                        <div id="upload-status" class="status-msg"></div>
                    </div>
                    <div class="files-list-section">
                        <h3>Indexed Documents</h3>
                        <ul id="files-list" class="files-list"></ul>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Navigation
        const navChat = document.getElementById('nav-chat');
        const navDocs = document.getElementById('nav-docs');
        const tabChat = document.getElementById('tab-chat');
        const tabDocs = document.getElementById('tab-docs');

        function switchTab(activeTab) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            if (activeTab === 'chat') {
                navChat.classList.add('active');
                tabChat.classList.add('active');
            } else {
                navDocs.classList.add('active');
                tabDocs.classList.add('active');
                loadFiles();
            }
        }
        navChat.addEventListener('click', () => switchTab('chat'));
        navDocs.addEventListener('click', () => switchTab('docs'));

        // Chat Logic
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const webSearchToggle = document.getElementById('web-search-toggle');
        let conversationHistory = [];

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function linkify(text) {
            const escapedText = escapeHtml(text);
            const urlPattern = /(https?:\/\/[^\s<>"]+)/g;
            return escapedText.replace(urlPattern, (url) => {
                return `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`;
            });
        }

        function appendMessage(role, text, docSources = [], webSources = []) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}-message`;
            if (role === 'assistant') {
                let content = linkify(text);
                if (docSources.length > 0 || webSources.length > 0) {
                    content += `<div class="sources-list"><strong>Sources:</strong>`;
                    if (docSources.length > 0) content += `<div class="source-category">Docs: ${docSources.join(', ')}</div>`;
                    if (webSources.length > 0) content += `<div class="source-category">Web: ${webSources.join(', ')}</div>`;
                    content += `</div>`;
                }
                msgDiv.innerHTML = content;
            } else {
                msgDiv.innerText = text;
            }
            chatWindow.appendChild(msgDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;
            appendMessage('user', text);
            userInput.value = '';
            conversationHistory.push({ role: 'user', content: text });
            
            const loadingMsg = document.createElement('div');
            loadingMsg.className = 'message assistant-message loading';
            loadingMsg.innerText = '...';
            chatWindow.appendChild(loadingMsg);
            
            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        messages: conversationHistory,
                        use_web_search: webSearchToggle.checked 
                    })
                });
                const data = await response.json();
                chatWindow.removeChild(loadingMsg);
                if (response.ok) {
                    appendMessage('assistant', data.response, data.doc_sources, data.web_sources);
                    conversationHistory.push({ role: 'assistant', content: data.response });
                } else {
                    appendMessage('assistant', `Error: ${data.error || 'Unknown error'}`);
                }
            } catch (error) {
                chatWindow.removeChild(loadingMsg);
                appendMessage('assistant', 'Error: Could not reach the backend server.');
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        // Documents Logic
        const fileUpload = document.getElementById('file-upload');
        const uploadBtn = document.getElementById('upload-btn');
        const uploadStatus = document.getElementById('upload-status');
        const filesList = document.getElementById('files-list');

        async function loadFiles() {
            try {
                const response = await fetch('/files');
                const files = await response.json();
                filesList.innerHTML = '';
                if (files.length === 0) {
                    filesList.innerHTML = '<li class="empty-msg">No documents indexed yet.</li>';
                    return;
                }
                files.forEach(file => {
                    const li = document.createElement('li');
                    li.className = 'file-item';
                    li.innerHTML = `
                        <span class="file-info">
                            <a href="/uploads/${file.name}" target="_blank" class="file-name">${file.name}</a>
                            <span class="file-size">${file.size}</span>
                        </span>
                        <button class="delete-btn" onclick="deleteFile('${file.name}')">Delete</button>
                    `;
                    filesList.appendChild(li);
                });
            } catch (error) {
                uploadStatus.innerText = 'Error loading files.';
                uploadStatus.classList.add('error');
            }
        }

        async function uploadFile() {
            const file = fileUpload.files[0];
            if (!file) return;
            const formData = new FormData();
            formData.append('file', file);
            uploadStatus.innerText = 'Indexing document...';
            uploadStatus.classList.remove('error');
            try {
                const response = await fetch('/upload', { method: 'POST', body: formData });
                const data = await response.json();
                if (response.ok) {
                    uploadStatus.innerText = data.message;
                    uploadStatus.classList.remove('error');
                    uploadStatus.classList.add('success');
                    fileUpload.value = '';
                    loadFiles();
                } else {
                    uploadStatus.innerText = data.error;
                    uploadStatus.classList.add('error');
                }
            } catch (error) {
                uploadStatus.innerText = 'Upload failed.';
                uploadStatus.classList.add('error');
            }
        }

        uploadBtn.addEventListener('click', () => fileUpload.click());
        fileUpload.addEventListener('change', uploadFile);

        async function deleteFile(filename) {
            if (!confirm(`Are you sure you want to delete ${filename}?`)) return;
            try {
                const response = await fetch(`/files/${filename}`, { method: 'DELETE' });
                const data = await response.json();
                if (response.ok) {
                    alert(data.message);
                    loadFiles();
                } else {
                    alert(data.error);
                }
            } catch (error) {
                alert('Delete failed.');
            }
        }
    </script>
</body>
</html>
